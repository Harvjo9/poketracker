name: Build Poké Track APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          echo "Android SDK: ${ANDROID_HOME:-unset}"
          if [ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate bundled JavaScript syntax
        shell: bash
        run: |
          for file in app/src/main/assets/www/{app,data,store,sync,config,entry-art,distributions,forms-catalog,shiny-forms,shiny-art,home-game-dex,magic-link}.js; do
            node --input-type=module --check < "$file"
          done
      - name: Verify Pokédex and form catalog requirements
        run: node scripts/verify-catalog.mjs
      - name: Verify colorful Pokémon theme and saved-progress compatibility
        run: node scripts/verify-theme.mjs
      - name: Verify visual form Dex artwork and distributions
        run: node scripts/verify-visual.mjs
      - name: Verify Shiny Forms ownership and artwork
        run: node scripts/verify-shiny.mjs
      - name: Verify Pokémon HOME reward game Dexes
        run: node scripts/verify-home-dex.mjs
      - name: Verify backups, cloud sync and signing guardrails
        run: node scripts/verify-reliability.mjs
      - name: Verify free Supabase email sign-in links
        run: node scripts/verify-magic-link.mjs
      - name: Verify gender and shiny switch rendering
        run: node scripts/verify-detail-switches.mjs
      - name: Check stable signing setup
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.POKE_TRACK_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.POKE_TRACK_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Stable signing configured; release APK enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing not yet configured; only a temporary debug APK will be available."
          fi
      - name: Build temporary debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload temporary debug APK
        uses: actions/upload-artifact@v4
        with:
          name: poke-track-v0.3.6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Smoke-test release signing with disposable key
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export POKE_TRACK_KEYSTORE_PATH="$RUNNER_TEMP/poketrack-smoke.jks"
          export POKE_TRACK_STORE_PASSWORD="$(openssl rand -hex 24)"
          export POKE_TRACK_KEY_ALIAS="poketrack-release"
          export POKE_TRACK_KEY_PASSWORD="$POKE_TRACK_STORE_PASSWORD"
          trap 'rm -f "$RUNNER_TEMP/poketrack-smoke.jks"' EXIT
          keytool -genkeypair -keystore "$POKE_TRACK_KEYSTORE_PATH" -storetype PKCS12 -alias "$POKE_TRACK_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -storepass "$POKE_TRACK_STORE_PASSWORD" -keypass "$POKE_TRACK_KEY_PASSWORD" -dname "CN=Poke Track Signing Smoke Test, O=Temporary CI Only" -noprompt >/dev/null 2>&1
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "app/build/outputs/apk/release/app-release.apk"
          echo "Release signing passed. Test key and signed smoke-test APK are NOT published."
          rm -f app/build/outputs/apk/release/app-release.apk
      - name: Restore stable signing keystore (private)
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.POKE_TRACK_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/poketrack-stable.jks"
          test -s "$RUNNER_TEMP/poketrack-stable.jks"
          chmod 600 "$RUNNER_TEMP/poketrack-stable.jks"
      - name: Build stable signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          POKE_TRACK_KEYSTORE_PATH: ${{ runner.temp }}/poketrack-stable.jks
          POKE_TRACK_STORE_PASSWORD: ${{ secrets.POKE_TRACK_STORE_PASSWORD }}
          POKE_TRACK_KEY_ALIAS: poketrack-release
          POKE_TRACK_KEY_PASSWORD: ${{ secrets.POKE_TRACK_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed release APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "app/build/outputs/apk/release/app-release.apk"
          echo "APK signature verified."
      - name: Upload stable release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: poke-track-v0.3.6-stable-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Delete temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/poketrack-stable.jks"
