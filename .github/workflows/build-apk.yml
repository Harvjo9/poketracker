name: Build Poké Track APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          echo "Android SDK: ${ANDROID_HOME:-unset}"
          if [ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate bundled JavaScript syntax
        shell: bash
        run: |
          for file in app/src/main/assets/www/{app,data,store,sync,config,entry-art,distributions,forms-catalog}.js; do
            node --input-type=module --check < "$file"
          done
      - name: Verify Pokédex and form catalog requirements
        run: node scripts/verify-catalog.mjs
      - name: Verify colorful Pokémon theme and saved-progress compatibility
        run: node scripts/verify-theme.mjs
      - name: Verify visual form Dex artwork and distributions
        run: node scripts/verify-visual.mjs
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: poke-track-v0.3.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
